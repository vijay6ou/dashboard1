      setMsg("Session saved: "+s.full);

    }

}

function App(){
  var sessions_state=useState(function(){return loadSessions();});
  var sessions=sessions_state[0],setSessions=sessions_state[1];
  var tab_state=useState("overview");
  var tab=tab_state[0],setTab=tab_state[1];
  var showAdd_state=useState(false);
  var showAdd=showAdd_state[0],setShowAdd=showAdd_state[1];
  var showExport_state=useState(false);
  var showExport=showExport_state[0],setShowExport=showExport_state[1];
  var deleteConfirm_state=useState(null);
  var deleteConfirm=deleteConfirm_state[0],setDeleteConfirm=deleteConfirm_state[1];

  function addSession(s){
    var existing=sessions.find(function(x){return x.id===s.id;});
    var updated;
    if(existing){
      updated=sessions.map(function(x){return x.id===s.id?s:x;});
    } else {
      updated=sessions.concat([s]);
    }
    updated.sort(function(a,b){return a.id.localeCompare(b.id);});
    setSessions(updated);
    saveSessions(updated);
    setShowAdd(false);
  }

  function deleteSession(id){
    var updated=sessions.filter(function(s){return s.id!==id;});
    setSessions(updated);
    saveSessions(updated);
    setDeleteConfirm(null);
  }

  function resetToSeed(){
    if(confirm("Reset to seed data (Apr 6-8)? All added sessions will be lost.")){
      setSessions(SEED_SESSIONS);
      saveSessions(SEED_SESSIONS);
    }
  }

  function exportData(){
    var blob=new Blob([JSON.stringify(sessions,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="vj_trading_sessions_backup.json"; a.click();
    URL.revokeObjectURL(url);
  }

  var totalNet=sessions.reduce(function(a,s){return a+s.net_pnl;},0);
  var totalRej=sessions.reduce(function(a,s){return a+s.rejected;},0);
  var avgScore=sessions.length?Math.round(sessions.reduce(function(a,s){return a+s.scores.overall;},0)/sessions.length):0;
  var last=sessions[sessions.length-1]||{};
  var prev=sessions[sessions.length-2]||null;

  var cumPnl=sessions.reduce(function(acc,s,i){
    var prev_cum=acc.length>0?acc[acc.length-1].cum:0;
    return acc.concat([{date:s.date||s.full,cum:prev_cum+s.net_pnl}]);
  },[]);
  var roiData=sessions.map(function(s){
    var pr=s.peer_rois||[];
    var peerAvg=pr.length?pr.reduce(function(a,b){return a+b;},0)/pr.length:0;
    return {date:s.date||s.full,roi:+s.net_roi.toFixed(4),peerAvg:+peerAvg.toFixed(3)};
  });
  var pnlSplit=sessions.map(function(s){
    return {date:s.date||s.full,pe:+(s.pe_pnl/1000).toFixed(1),ce:+(s.ce_pnl/1000).toFixed(1),net:+(s.net_pnl/1000).toFixed(1)};
  });
  var rejData=sessions.map(function(s){
    return {date:s.date||s.full,rejected:s.rejected,rate:+(s.rejected/(s.rejected+(s.executed||1))*100).toFixed(1)};
  });
  var scoreData=sessions.map(function(s){
    var obj={date:s.date||s.full,overall:s.scores.overall};
    DIMS.forEach(function(d){obj[d]=s.scores[d]||0;});
    return obj;
  });
  var dimCompare=DIMS.map(function(d){
    var obj={dim:DL[d]};
    sessions.forEach(function(s){obj[s.date||s.full]=s.scores[d]||0;});
    return obj;
  });
  var radarData=sessions.length>=2?DIMS.map(function(d){
    var obj={subject:DL[d]};
    var last2=sessions.slice(-2);
    last2.forEach(function(s){obj[s.date||s.full]=s.scores[d]||0;});
    return obj;
  }):[];

  var sessionColors=sessions.map(function(_,i){return SC_COLORS[i%SC_COLORS.length];});

  var tabs=["overview","pnl","scores","violations","sessions"];
  var tabLabels={overview:"Overview",pnl:"P&L Split",scores:"Scores",violations:"Violations",sessions:"All Sessions"};

  function tabBtn(t){
    return e("button",{key:t,onClick:function(){setTab(t);},style:{
      padding:"8px 16px",fontSize:13,fontWeight:tab===t?600:400,
      background:"transparent",border:"none",
      borderBottom:tab===t?"2px solid #3b82f6":"2px solid transparent",
      color:tab===t?"#3b82f6":"#64748b",marginBottom:-1,cursor:"pointer"

  }

          return e("div",{key:s.id,style:{marginBottom:14,paddingBottom:14,borderBottom:i<sessions.length-1?"1px solid "+bdr:"none"}},
            e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12}},
              e("span",{style:{fontWeight:700,color:sessionColors[i]}},s.full),
              e("span",{style:{color:"#64748b",fontSize:11}},viols.length+" violations · "+s.rejected+" rejections")
            ),
            viols.length>0
              ?viols.map(function(v,j){return e("div",{key:j,style:{fontSize:11,color:"#94a3b8",padding:"3px 0 3px 10px",borderLeft:"2px solid "+sessionColors[i]+"70",marginBottom:3}},"• "+v);})
              :e("div",{style:{fontSize:11,color:"#22c55e",fontStyle:"italic"}},"No violations recorded")
          );
        })
      ),
      e(CBox,{title:"Rejection Trend — Discipline Watch"},
        e(ResponsiveContainer,{width:"100%",height:160},
          e(ComposedChart,{data:sessions.map(function(s){return {date:s.date||s.full,discipline:s.scores.discipline,rejected:s.rejected};}),margin:{top:4,right:40,left:-10,bottom:0}},
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#ffffff10"}),
            e(XAxis,{dataKey:"date",tick:{fontSize:10,fill:"#64748b"},stroke:"#ffffff20"}),
            e(YAxis,{yAxisId:"l",domain:[0,100],tick:{fontSize:10,fill:"#64748b"},stroke:"#ffffff20"}),
            e(YAxis,{yAxisId:"r",orientation:"right",tick:{fontSize:10,fill:"#64748b"},stroke:"#ffffff20"}),
            e(Tooltip,{content:e(TT)}),
            e(Bar,{yAxisId:"r",dataKey:"rejected",radius:[3,3,0,0],name:"Rejections"},
              sessions.map(function(s,i){return e(Cell,{key:i,fill:s.rejected>100?"#ef444460":s.rejected>10?"#f9741660":"#22c55e60"});})
            ),
            e(Line,{yAxisId:"l",type:"monotone",dataKey:"discipline",stroke:"#3b82f6",strokeWidth:2.5,dot:{r:5,fill:"#3b82f6",stroke:bg1,strokeWidth:2},name:"Discipline Score"})
          )
        ),
        e("div",{style:{fontSize:10,color:"#64748b",marginTop:6}},"Discipline score (blue) vs rejection count (bars) — should move in opposite directions. Widening gap = structural problem.")
      )
    ),

    // ── ALL SESSIONS TABLE ───────────────────────────────────────────────
    tab==="sessions"&&e("div",null,
      e("div",{style:{overflowX:"auto",marginBottom:14}},
        e("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:11}},
          e("thead",null,
            e("tr",{style:{borderBottom:"2px solid "+bdr,background:bg1}},
              ["Date","Index","DTE","VIX","MT","PE P&L","CE P&L","Net P&L","Net ROI","vs Peers","Exec","Rej","Score","Carry",""].map(function(h){
                return e("th",{key:h,style:{padding:"9px 8px",textAlign:["PE P&L","CE P&L","Net P&L","Net ROI","Exec","Rej","Score"].indexOf(h)>=0?"right":"left",
                  color:"#64748b",fontWeight:600,whiteSpace:"nowrap"}},h);
              })
            )
          ),
          e("tbody",null,
            sessions.slice().reverse().map(function(s,i){
              var pr=s.peer_rois||[];
              var above=pr.filter(function(p){return s.net_roi>p;}).length;
              return e("tr",{key:s.id,style:{borderBottom:"1px solid "+bdr,background:i%2===0?"transparent":bg1+"88"}},
                e("td",{style:{padding:"8px",fontWeight:700,fontSize:12}},s.full),
                e("td",{style:{padding:"8px",fontSize:10,color:"#64748b"}},s.index||"—"),
                e("td",{style:{padding:"8px",textAlign:"center"}},e("span",{style:{padding:"2px 7px",borderRadius:3,background:s.dte===0?"#ef444420":"#3b82f620",color:s.dte===0?"#ef4444":"#3b82f6",fontSize:10,fontWeight:700}},s.dte)),
                e("td",{style:{padding:"8px",color:s.vix>24?"#ef4444":s.vix>20?"#f97316":"#22c55e",fontWeight:700}},s.vix),
                e("td",{style:{padding:"8px",color:s.mt>=7?"#ef4444":s.mt>=5.5?"#f59e0b":"#22c55e",fontWeight:600}},s.mt+"/10"),
                e("td",{style:{padding:"8px",textAlign:"right",color:"#22c55e"}},fmt(s.pe_pnl)),
                e("td",{style:{padding:"8px",textAlign:"right",color:"#ef4444"}},fmt(s.ce_pnl)),
                e("td",{style:{padding:"8px",textAlign:"right",fontWeight:700,fontSize:13,color:s.net_pnl>=0?"#22c55e":"#ef4444"}},fmt(s.net_pnl)),
                e("td",{style:{padding:"8px",textAlign:"right",fontWeight:700,color:s.net_roi>=0.5?"#22c55e":s.net_roi>=0?"#f59e0b":"#ef4444"}},pct(s.net_roi)),
                e("td",{style:{padding:"8px",textAlign:"right",color:above===pr.length&&pr.length>0?"#22c55e":above===0?"#ef4444":"#f59e0b",fontWeight:700}},pr.length?above+"/"+pr.length+"↑":"—"),
                e("td",{style:{padding:"8px",textAlign:"right",color:"#64748b"}},s.executed||"—"),
                e("td",{style:{padding:"8px",textAlign:"right",fontWeight:700,fontSize:13,color:s.rejected>100?"#ef4444":s.rejected>10?"#f97316":"#22c55e"}},s.rejected),
                e("td",{style:{padding:"8px",textAlign:"right"}},
                  e("span",{style:{fontWeight:700,fontSize:15,color:sc(s.scores.overall)}},s.scores.overall),
                  e("span",{style:{fontSize:9,color:"#64748b",marginLeft:3}},sl(s.scores.overall))
                ),
                e("td",{style:{padding:"8px",color:s.carry_out>0?"#f59e0b":"#22c55e",fontWeight:600,fontSize:10}},typeof s.carry_out==="number"?(s.carry_out>0?s.carry_out+" open":"Clean"):"—"),
                e("td",{style:{padding:"8px",textAlign:"center"}},
                  deleteConfirm===s.id
                    ?e("span",null,
                        e("span",{style:{fontSize:10,color:"#ef4444",marginRight:6}},"Sure?"),
                        e("button",{onClick:function(){deleteSession(s.id);},style:{fontSize:10,padding:"1px 6px",cursor:"pointer",background:"#ef444430",border:"1px solid #ef4444",borderRadius:3,color:"#ef4444",marginRight:4}},"Yes"),
                        e("button",{onClick:function(){setDeleteConfirm(null);},style:{fontSize:10,padding:"1px 6px",cursor:"pointer",background:"transparent",border:"1px solid #2d3147",borderRadius:3,color:"#64748b"}},"No")
                      )
                    :e("button",{onClick:function(){setDeleteConfirm(s.id);},style:{fontSize:10,padding:"1px 8px",cursor:"pointer",background:"transparent",border:"1px solid #2d3147",borderRadius:3,color:"#475569"}},"✕")
                )
              );
            }).concat([
              e("tr",{key:"total",style:{borderTop:"2px solid "+bdr,background:bg1,fontWeight:700}},
                e("td",{style:{padding:"8px"},colSpan:5},sessions.length+"-Session Total"),
                e("td",{style:{padding:"8px",textAlign:"right",color:"#22c55e"}},fmt(sessions.reduce(function(a,s){return a+s.pe_pnl;},0))),
                e("td",{style:{padding:"8px",textAlign:"right",color:"#ef4444"}},fmt(sessions.reduce(function(a,s){return a+s.ce_pnl;},0))),
                e("td",{style:{padding:"8px",textAlign:"right",color:totalNet>=0?"#22c55e":"#ef4444",fontSize:13}},fmt(totalNet)),
                e("td",{style:{padding:"8px",textAlign:"right",color:totalNet>=0?"#22c55e":"#ef4444"}},pct(totalNet/80000000*100)),
                e("td",{style:{padding:"8px",color:"#64748b",fontSize:10},colSpan:6},"Avg score: "+avgScore+" · Total rejections: "+totalRej+" · "+sessions.length+" sessions")
              )
            ])
          )
        )
      ),
      e("div",{style:{textAlign:"center",padding:"16px 0"}},
        e("button",{onClick:function(){setShowAdd(true);},style:{
          padding:"10px 24px",fontSize:13,fontWeight:600,cursor:"pointer",
          background:"#3b82f6",border:"none",borderRadius:8,color:"#fff"
        }},"+ Add New Session")
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));

</script>
</body>
</html>
